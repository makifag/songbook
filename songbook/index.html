<!doctype html>
<html lang="ru"><head>

<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 1.5em; }
h1 { margin-bottom: 0.3em; }
.controls { display: flex; gap: 0.5em; flex-wrap: wrap; margin-bottom: 1em; position: sticky; top: 0;

</style>
</head><body>
<h1>Песенник</h1>
<p class="report-link"><a href="report.html">Отчёт о сборке</a></p>
<div class="controls">

<ul id="list"></ul>

 "Виктор Цой", "kind": "chords", "domain": "amdm.ru"}, {"slug": "kino-viktor-tsoy-zvezda-po-imeni-solnce", "title": "Звезда по имени Солнце", "artist": "Виктор Цой", "kind": "chords", "domain": "amdm.ru"}, {"slug": "kino-viktor-tsoy-spokoynaya-noch", "title": "Спокойная ночь", "artist": "Виктор Цой", "kind": "chords", "domain": "amdm.ru"}, {"slug": "shadow-of-the-colossus-the-farthest-land", "title": "The Farthest Land", "artist": "Shadow of the Colossus", "kind": "tab", "domain": "gametabs.net"}, {"slug": "naruto-shippuuden-samidare-early-summer-rain", "title": "Samidare (Early Summer Rain)", "artist": "Naruto Shippuuden", "kind": "tab", "domain": "gametabs.net"}, {"slug": "undertale-megalovania", "title": "Megalovania", "artist": "Undertale", "kind": "tab", "domain": "gametabs.net"}, {"slug": "undertale-battle-with-true-hero", "title": "Battle With True Hero", "artist": "Undertale", "kind": "tab", "domain": "gametabs.net"}, {"slug": "undertale-home", "title": "Home", "artist": "Undertale", "kind": "tab", "domain": "gametabs.net"}, {"slug": "undertale-sans-0", "title": "Sans", "artist": "Undertale", "kind": "tab", "domain": "gametabs.net"}, {"slug": "undertale-spider-dance-muffet-theme", "title": "Spider Dance (Muffet Theme)", "artist": "Undertale", "kind": "tab", "domain": "gametabs.net"}, {"slug": "cave-story-heros-end-0", "title": "Hero's End", "artist": "Cave Story", "kind": "tab", "domain": "gametabs.net"}, {"slug": "tales-from-earthsea-tasogare", "title": "Tasogare", "artist": "Tales from Earthsea", "kind": "tab", "domain": "gametabs.net"}, {"slug": "final-fantasy-vi-terras-theme-1", "title": "Terra's Theme", "artist": "Final Fantasy VI", "kind": "tab", "domain": "gametabs.net"}, {"slug": "final-fantasy-vi-phantom-forest-2", "title": "Phantom Forest", "artist": "Final Fantasy VI", "kind": "tab", "domain": "gametabs.net"}, {"slug": "final-fantasy-vi-kefkas-theme-1", "title": "Kefka's Theme", "artist": "Final Fantasy VI", "kind": "tab", "domain": "gametabs.net"}, {"slug": "final-fantasy-vi-aria-di-mezzo-carattere", "title": "Aria Di Mezzo Carattere", "artist": "Final Fantasy VI", "kind": "tab", "domain": "gametabs.net"}, {"slug": "final-fantasy-vi-aria-de-mezzo-caraterre", "title": "Aria De Mezzo Caraterre", "artist": "Final Fantasy VI", "kind": "tab", "domain": "gametabs.net"}, {"slug": "flyour-bud-moim-smislom", "title": "Будь моим смыслом", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "flyour-remont", "title": "Ремонт", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "final-fantasy-vi-lockes-theme", "title": "Locke's Theme", "artist": "Final Fantasy VI", "kind": "tab", "domain": "gametabs.net"}, {"slug": "flyour-rozoviy-slon", "title": "Розовый слон", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "flyour-sinie-teni", "title": "Синие тени", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "flyour-nastoyaschee-chto-nibud", "title": "Настоящее что-нибудь", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "laertskiy-hui-govno-i-muravey", "title": "Хуй, говно и муравей", "artist": "Лаэртский", "kind": "chords", "domain": "gitaristu.ru"}, {"slug": "orkestr-che-gorod", "title": "Город", "artist": "Оркестр Че", "kind": "chords", "domain": "mychords.net"}, {"slug": "dayte-tank-spam", "title": "Спам", "artist": "Дайте танк (!)", "kind": "chords", "domain": "amdm.ru"}, {"slug": "dayte-tank-drug", "title": "Друг", "artist": "Дайте танк (!)", "kind": "chords", "domain": "amdm.ru"}, {"slug": "dayte-tank-vualya", "title": "Вуаля", "artist": "Дайте танк (!)", "kind": "chords", "domain": "amdm.ru"}, {"slug": "flyour-tancuyschiy-bog", "title": "Танцующий бог", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "flyour-kislorod", "title": "Кислород", "artist": "Flёur", "kind": "chords", "domain": "amdm.ru"}, {"slug": "dayte-tank-volna", "title": "Волна", "artist": "Дайте танк (!)", "kind": "chords", "domain": "amdm.ru"}, {"slug": "a-short-hike-hello", "title": "Hello?", "artist": "A Short Hike", "kind": "tab", "domain": "gametabs.net"}, {"slug": "lil-gator-game-forest-main", "title": "Lil Gator Game - Forest Main", "artist": "Misc Computer Games", "kind": "tab", "domain": "tabs.ultimate-guitar.com"}, {"slug": "puck-piper-shotlandec", "title": "Шотландец", "artist": "Puck & Piper", "kind": "chords", "domain": "Puck & Piper"}, {"slug": "puck-piper-dzhonni-pryzhok", "title": "Джонни-прыжок", "artist": "Puck & Piper", "kind": "chords", "domain": "Puck & Piper"}, {"slug": "traditional-greensleeves", "title": "Greensleeves", "artist": "Traditional", "kind": "tab", "domain": "Traditional"}, {"slug": "yann-tiersen-la-valse-damelie", "title": "La Valse d'Amélie (Piano Version)", "artist": "Yann Tiersen", "kind": "tab", "domain": "Yann Tiersen"}];
var list = document.getElementById('list');
var q = document.getElementById('q');
var kindFilter = document.getElementById('kindFilter');
var artistFilter = document.getElementById('artistFilter');
var countEl = document.getElementById('count');

var artists = Array.from(new Set(SONGS.map(function(s){ return s.artist; }))).filter(Boolean).sort();
artists.forEach(function(a){
  var opt = document.createElement('option');
  opt.value = a; opt.textContent = a;
  artistFilter.appendChild(opt);
});

function norm(s) { return (s || '').toLowerCase(); }

function render() {
  var query = norm(q.value);
  var kind = kindFilter.value;
  var artist = artistFilter.value;
  var filtered = SONGS.filter(function(s) {
    if (kind && s.kind !== kind) return false;
    if (artist && s.artist !== artist) return false;
    if (query && norm(s.title).indexOf(query) === -1 && norm(s.artist).indexOf(query) === -1) return false;
    return true;
  });
  list.innerHTML = '';
  filtered.forEach(function(s) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = 'songs/' + s.slug + '.html';
    a.textContent = s.title;
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = s.kind === 'tab' ? 'таб' : 'аккорды';
    li.appendChild(a);
    li.appendChild(badge);
    var artistDiv = document.createElement('div');
    artistDiv.className = 'song-artist';
    artistDiv.textContent = s.artist;
    li.appendChild(artistDiv);
    list.appendChild(li);
  });
  countEl.textContent = filtered.length + ' из ' + SONGS.length;
}

q.addEventListener('input', render);
kindFilter.addEventListener('change', render);
artistFilter.addEventListener('change', render);
render();
</script>
</body></html>
