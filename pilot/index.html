<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Песенник: пилот форматов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: узкая колонка-лист песни; сверху переключатель песен, под ним панель управления; табы и ноты рисует alphaTab, аккорды — свой ChordPro-рендер */
:root {
  --bg: #f3f4f1;
  --paper: #fbfbf9;
  --ink: #1c2220;
  --muted: #5d6763;
  --rule: #d6dbd7;
  --accent: #1d6a63;      /* сталь струн, патина */
  --chord: #9a4a12;       /* аккорды */
  --chip: #e4e9e5;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --paper: #181d1c; --ink: #e2e7e4; --muted: #97a29d; --rule: #2c3431;
    --accent: #6cc4b9; --chord: #f0a463; --chip: #232a28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --paper: #181d1c; --ink: #e2e7e4; --muted: #97a29d; --rule: #2c3431;
  --accent: #6cc4b9; --chord: #f0a463; --chip: #232a28; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-text); }
.wrap { max-width: 56rem; margin: 0 auto; padding: 1.25rem 16px 4rem; display: grid; gap: 1rem; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; }
.brand { font: 600 .78rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
nav.songs { display: flex; flex-wrap: wrap; gap: .4rem; }
nav.songs button {
  font: 500 .85rem/1 var(--f-mono); padding: .55rem .8rem; border-radius: 6px;
  border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer;
}
nav.songs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 1.25rem clamp(16px, 4vw, 2.25rem) 2rem; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .75rem 1.5rem; border-bottom: 1px solid var(--rule); padding-bottom: .9rem; margin-bottom: 1.1rem; }
.head h1 { margin: 0; font: 600 clamp(1.6rem, 4.5vw, 2.3rem)/1.1 var(--f-text); text-wrap: balance; }
.head .by { color: var(--muted); font-size: 1rem; margin-top: .25rem; }
.meta { display: flex; flex-wrap: wrap; gap: .35rem; }
.meta span { font: 500 .72rem/1 var(--f-mono); letter-spacing: .04em; padding: .35rem .5rem; border-radius: 4px; background: var(--chip); color: var(--muted); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; margin-bottom: 1rem; }
.controls button, .controls label {
  font: 500 .82rem/1 var(--f-mono); padding: .55rem .75rem; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; gap: .4rem;
}
.controls button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); min-width: 7.5rem; justify-content: center; }
.controls button:disabled { opacity: .5; cursor: progress; }
.controls .val { font-variant-numeric: tabular-nums; min-width: 2.6rem; text-align: right; }
.controls input[type=range] { accent-color: var(--accent); width: 7rem; }
.controls .status { font: .78rem/1.3 var(--f-mono); color: var(--muted); }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ChordPro */
.cp { font-size: 1.05rem; }
.cp .line { display: flex; flex-wrap: wrap; align-items: flex-end; min-height: 1.6em; }
.cp .seg { display: inline-flex; flex-direction: column; white-space: pre; }
.cp .seg .c { font: 600 .9rem/1.2 var(--f-mono); color: var(--chord); min-height: 1.2em; padding-right: .5ch; }
.cp .seg .t { line-height: 1.4; }
.cp .line.nochords .seg .c { display: none; }
.cp .instrow { display: flex; flex-wrap: wrap; gap: .2rem .6rem; font: 600 .95rem/1.4 var(--f-mono); color: var(--chord); }
.cp .instrow .bar { color: var(--muted); font-weight: 400; }
.cp .blank { height: .9rem; }
.cp .label { font: 600 .74rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 1.1rem 0 .45rem; }
.cp .chorus { border-left: 3px solid var(--accent); padding-left: .9rem; margin-left: -.9rem; }
.cp .chorus > .label:first-child { margin-top: .4rem; }
.cp pre.tab, pre.rawtxt { font: .82rem/1.35 var(--f-mono); overflow-x: auto; margin: 0 0 .5rem; padding: .6rem .7rem; background: var(--chip); border-radius: 6px; color: var(--ink); }

#at-host { min-width: 0; overflow-x: auto; }
#at { color: var(--ink); }
/* alphaTab рисует SVG; курсор и подсветка тактов */
.at-cursor-bar { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.at-cursor-beat { background: var(--accent); width: 3px; }
.at-highlight * { fill: var(--accent); stroke: var(--accent); }
.loading { color: var(--muted); font: .85rem var(--f-mono); padding: 2rem 0; }

details.src { border-top: 1px solid var(--rule); padding-top: .8rem; margin-top: 1.5rem; }
details.src summary { cursor: pointer; font: 500 .8rem var(--f-mono); color: var(--muted); }
details.src pre { margin-top: .7rem; max-height: 28rem; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Песенник · пилот форматов</div>
    <nav class="songs" id="nav" aria-label="Песни"></nav>
  </header>
  <main class="sheet" id="sheet">
    <div class="loading">Загружаю…</div>
  </main>
</div>

<script src="vendor/alphatab/alphaTab.min.js"></script>
<script>
const SONGS = [
  { id: "kukushka", kind: "chordpro", file: "songs/kino-kukushka.cho", raw: "raw/kino-viktor-tsoy-kukushka.txt", label: "Кукушка" },
  { id: "home", kind: "alphatex", file: "songs/undertale-home.atex", raw: "raw/undertale-home.txt", label: "Home" },
];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- ChordPro ---------- */
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
const IDX = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11, H: 11 };
function transposeChord(ch, n) {
  if (!n) return ch;
  return ch.replace(/([A-H])(#|b)?/g, (m, r, acc) => {
    const i = IDX[r + (acc || "")];
    return i === undefined ? m : NOTES[(i + n + 120) % 12];
  });
}
function parseChordPro(src) {
  const meta = {}, blocks = [];
  let env = null, cur = blocks;
  for (const raw of src.split(/\r?\n/)) {
    const d = /^\{\s*([\w_]+)\s*(?::\s*(.*?))?\s*\}$/.exec(raw.trim());
    if (d) {
      const [, key, val] = d;
      if (["title", "t", "artist", "key", "capo", "tempo", "time"].includes(key)) { meta[key === "t" ? "title" : key] = val; continue; }
      if (/^(start_of_|so)(chorus|c|tab|t|verse|v)$/.test(key)) {
        const type = /chorus|^soc$/.test(key) ? "chorus" : /tab|^sot$/.test(key) ? "tab" : "verse";
        env = { type, label: val || (type === "chorus" ? "Припев" : ""), lines: [] };
        blocks.push(env); cur = env.lines; continue;
      }
      if (/^(end_of_|eo)/.test(key)) { env = null; cur = blocks; continue; }
      if (key === "comment" || key === "c") { cur.push({ type: "label", text: val }); continue; }
      continue;
    }
    if (env && env.type === "tab") { cur.push({ type: "tabline", text: raw }); continue; }
    if (!raw.trim()) { cur.push({ type: "blank" }); continue; }
    const segs = [];
    const re = /\[([^\]]+)\]/g;
    let last = 0, m, pending = "";
    while ((m = re.exec(raw))) {
      const txt = raw.slice(last, m.index);
      if (segs.length || txt) segs.push({ c: pending, t: txt });
      pending = m[1]; last = re.lastIndex;
    }
    segs.push({ c: pending, t: raw.slice(last) });
    const withChords = segs.some((s) => s.c);
    const lyricText = segs.map((s) => s.t).join("").trim();
    const inst = withChords && /^[|\s]*$/.test(lyricText);
    cur.push({ type: "line", segs, withChords, inst });
  }
  return { meta, blocks };
}
function renderLine(l, n) {
  if (l.type === "blank") return '<div class="blank"></div>';
  if (l.type === "label") return `<div class="label">${esc(l.text)}</div>`;
  // слова без аккорда отделяем в свои сегменты, чтобы строка переносилась по словам
  const parts = [];
  for (const s of l.segs) {
    const words = s.t.split(/(?<=\s)(?=\S)/);
    parts.push({ c: s.c, t: words[0] ?? "" });
    for (const w of words.slice(1)) parts.push({ c: "", t: w });
  }
  if (l.inst) {
    // инструментальная строка "Am | C | G | F" — просто ряд аккордов
    const row = l.segs.filter((s) => s.c).map((s) => `<span class="c">${esc(transposeChord(s.c, n))}</span>`).join('<span class="bar">|</span>');
    return `<div class="instrow">${row}</div>`;
  }
  const html = parts.map((p) => {
    const c = p.c ? esc(transposeChord(p.c, n)) : "";
    const t = p.t === "" ? " " : esc(p.t);
    return `<span class="seg"><span class="c">${c}</span><span class="t">${t}</span></span>`;
  }).join("");
  return `<div class="line${l.withChords ? "" : " nochords"}${l.inst ? " inst" : ""}">${html}</div>`;
}
function renderChordPro(doc, n) {
  const out = [];
  for (const b of doc.blocks) {
    if (b.type === "tab") {
      const body = b.lines.map((l) => l.text).join("\n").replace(/\n+$/, "");
      out.push((b.label ? `<div class="label">${esc(b.label)}</div>` : "") + `<pre class="tab">${esc(body)}</pre>`);
    } else if (b.type === "chorus" || b.type === "verse") {
      out.push(`<div class="${b.type}">${b.label ? `<div class="label">${esc(b.label)}</div>` : ""}${b.lines.map((l) => renderLine(l, n)).join("")}</div>`);
    } else out.push(renderLine(b, n));
  }
  return out.join("").replace(/^(<div class="blank"><\/div>)+/, "");
}

/* ---------- страница ---------- */
let api = null;
async function load(song) {
  if (api) { try { api.destroy(); } catch (e) {} api = null; }
  document.querySelectorAll("#nav button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === song.id));
  try { localStorage.setItem("pilot.song", song.id); } catch (e) {}
  const sheet = $("#sheet");
  sheet.innerHTML = '<div class="loading">Загружаю…</div>';
  const [src, raw] = await Promise.all([fetch(song.file).then((r) => r.text()), fetch(song.raw).then((r) => r.text())]);
  const srcBlock = `<details class="src"><summary>Исходник с сайта (как было)</summary><pre class="rawtxt">${esc(raw)}</pre></details>
    <details class="src"><summary>Файл в новом формате (.${song.file.split(".").pop()})</summary><pre class="rawtxt">${esc(src)}</pre></details>`;
  if (song.kind === "chordpro") showChordPro(sheet, src, srcBlock);
  else showAlphaTex(sheet, src, srcBlock);
}

function showChordPro(sheet, src, srcBlock) {
  const doc = parseChordPro(src);
  let n = 0;
  sheet.innerHTML = `
    <div class="head"><div><h1>${esc(doc.meta.title || "")}</h1><div class="by">${esc(doc.meta.artist || "")}</div></div>
      <div class="meta"><span>ChordPro</span><span>аккорды + табы</span></div></div>
    <div class="controls">
      <button id="tdown" aria-label="Тон ниже">− тон</button>
      <span class="status">транспонирование <b class="val" id="tval">0</b></span>
      <button id="tup" aria-label="Тон выше">+ тон</button>
    </div>
    <div class="cp" id="cp"></div>${srcBlock}`;
  const draw = () => { $("#cp").innerHTML = renderChordPro(doc, n); $("#tval").textContent = n > 0 ? "+" + n : n; };
  $("#tdown").onclick = () => { n -= 1; if (n < -5) n += 12; draw(); };
  $("#tup").onclick = () => { n = n + 1; if (n > 6) n -= 12; draw(); };
  draw();
}

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function showAlphaTex(sheet, src, srcBlock) {
  const title = (/\\title\s+"([^"]*)"/.exec(src) || [])[1] || "";
  const artist = (/\\artist\s+"([^"]*)"/.exec(src) || [])[1] || "";
  const tuning = (/\\tuning\s+([^\n]+)/.exec(src) || [])[1] || "";
  const ts = (/\\ts\s+(\d+)\s+(\d+)/.exec(src) || []).slice(1).join("/");
  const tuneName = tuning.trim() === "d4 a3 g3 d3 a2 d2" ? "DADGAD" : tuning.toUpperCase();
  sheet.innerHTML = `
    <div class="head"><div><h1>${esc(title)}</h1><div class="by">${esc(artist)}</div></div>
      <div class="meta"><span>alphaTex</span><span>строй ${esc(tuneName)}</span>${ts ? `<span>${ts}</span>` : ""}</div></div>
    <div class="controls">
      <button class="primary" id="play" disabled>Загрузка звука…</button>
      <button id="stop" disabled>Стоп</button>
      <label for="speed">темп <input type="range" id="speed" min="40" max="120" step="5" value="100"><span class="val" id="speedv">100%</span></label>
      <label for="metro"><input type="checkbox" id="metro"> метроном</label>
      <label for="view"><input type="checkbox" id="view" checked> ноты</label>
    </div>
    <div id="at-host"><div id="at"></div></div>${srcBlock}`;

  const base = new URL("vendor/alphatab/", location.href).href;
  const narrow = window.innerWidth < 600;
  api = new alphaTab.AlphaTabApi($("#at"), {
    core: { fontDirectory: base + "font/", scriptFile: base + "alphaTab.min.js" },
    display: { scale: narrow ? 0.75 : 0.95, staveProfile: "ScoreTab",
      resources: { mainGlyphColor: cssVar("--ink"), secondaryGlyphColor: cssVar("--muted"), staffLineColor: cssVar("--rule"), barSeparatorColor: cssVar("--muted"), barNumberColor: cssVar("--accent"), scoreInfoColor: cssVar("--ink") } },
    notation: { elements: { scoreTitle: false, scoreArtist: false, scoreSubTitle: false, scoreWordsAndMusic: false } },
    player: { playerMode: "EnabledSynthesizer", soundFont: base + "soundfont/sonivox.sf2", enableCursor: true, enableUserInteraction: true, scrollMode: "Continuous" },
  });
  api.tex(src);
  const play = $("#play");
  api.soundFontLoad.on((e) => { play.textContent = `Звук ${Math.round((e.loaded / e.total) * 100)}%`; });
  api.playerReady.on(() => { play.disabled = false; $("#stop").disabled = false; play.textContent = "▶ Играть"; });
  api.playerStateChanged.on((e) => { play.textContent = e.state === 1 ? "❚❚ Пауза" : "▶ Играть"; });
  play.onclick = () => api.playPause();
  $("#stop").onclick = () => api.stop();
  $("#speed").oninput = (e) => { api.playbackSpeed = e.target.value / 100; $("#speedv").textContent = e.target.value + "%"; };
  $("#metro").onchange = (e) => { api.metronomeVolume = e.target.checked ? 1 : 0; };
  $("#view").onchange = (e) => { api.settings.display.staveProfile = e.target.checked ? alphaTab.StaveProfile.ScoreTab : alphaTab.StaveProfile.Tab; api.updateSettings(); api.render(); };
}

const nav = $("#nav");
for (const s of SONGS) {
  const b = document.createElement("button");
  b.textContent = s.label; b.dataset.id = s.id; b.onclick = () => load(s);
  nav.appendChild(b);
}
let first = SONGS[0];
try { first = SONGS.find((s) => s.id === localStorage.getItem("pilot.song")) || first; } catch (e) {}
load(first);
</script>
</body>
</html>
